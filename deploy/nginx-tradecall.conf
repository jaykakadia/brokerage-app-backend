upstream tradecall_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS (single 301 hop for both bare domain and www)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tradecall.in www.tradecall.in;
    return 301 https://tradecall.in$request_uri;
}

# Redirect HTTPS www to HTTPS non-www (single 301 hop)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tradecall.in;

    ssl_certificate /etc/letsencrypt/live/tradecall.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tradecall.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://tradecall.in$request_uri;
}

# Main HTTPS server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tradecall.in;

    root /var/www/tradecall;
    index index.html;
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/tradecall.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tradecall.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Short proxy timeouts & retry policy so slow backend does not hang site
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

    # 1. Specific legacy path redirects
    location = /home {
        return 301 https://tradecall.in/;
    }

    location = /Terms-of-use-tradecall-India {
        return 301 /terms-of-use;
    }

    # 2. Static root files
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # 3. Static Assets (Vite build output) - ^~ prevents regex match
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 4. Uploads (User images and media) - ^~ prevents regex match
    location ^~ /uploads/ {
        alias /opt/tradecall/brokerage-app-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @proxy_uploads;
    }

    location @proxy_uploads {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 5. Static file extensions (served directly from web root, 404 if missing)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|map|json|txt)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 6. Sitemaps -> Proxy to FastAPI
    location ~ ^/sitemap(_index)?.*\.xml$ {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. API requests -> Proxy to FastAPI
    location ^~ /api/ {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 8. All HTML navigation -> Proxy to FastAPI for SSR
    location / {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }
}
