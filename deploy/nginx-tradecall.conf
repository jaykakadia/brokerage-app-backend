upstream tradecall_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redirect HTTPS www to HTTPS non-www
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.tradecall.in;

    ssl_certificate /etc/letsencrypt/live/tradecall.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tradecall.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://tradecall.in$request_uri;
}

server {
    server_name tradecall.in;

    root /var/www/tradecall;
    index index.html;
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /home {
        return 301 https://tradecall.in/;
    }

    location /api/ {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /Terms-of-use-tradecall-India {
        return 301 /terms-of-use;
    }

    location /uploads/ {
        proxy_pass http://tradecall_api;
        proxy_set_header Host $host;
        expires 30d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /properties/ {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /listing/ {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* /TC(011P)?-\d+$ {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass http://tradecall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        rewrite ^ /index.html break;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tradecall.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tradecall.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.tradecall.in) {
        return 301 https://tradecall.in$request_uri;
    } # managed by Certbot

    if ($host = tradecall.in) {
        return 301 https://tradecall.in$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tradecall.in www.tradecall.in;
    return 301 https://tradecall.in$request_uri;
}
